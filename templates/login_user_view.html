{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | BarberPro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
</head>
<body>
    <div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="row g-0 shadow-none" style="max-width: 860px; width: 100%; border: 1px solid var(--bp-border); border-radius: var(--bp-radius-lg); overflow: hidden;">

            <div class="col-md-5 d-flex flex-column justify-content-center p-5" style="background: var(--bp-ink);">
                <div style="width: 28px; height: 4px; background: var(--bp-accent); margin-bottom: 16px;"></div>
                <h1 class="fw-bold mb-3" style="color: #FAFAF8; font-size: 1.9rem;">BarberPro</h1>
                <p class="mb-0" style="color: #B8B6B0; font-size: 0.92rem;">
                    Gestiona ventas, empleados y reportes de tu barbería desde un solo lugar.
                </p>
            </div>

            <div class="col-md-7 p-5" style="background: var(--bp-surface);">
                <p class="text-muted mb-1" style="font-size: 0.85rem;">Bienvenido de nuevo</p>
                <h2 class="fw-semibold mb-4" style="font-size: 1.3rem;">Inicia sesión</h2>

                {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-danger" role="alert"><small>{{ message }}</small></div>
                    {% endfor %}
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label" for="username">Usuario</label>
                        <input type="text" class="form-control" name="username" id="username" placeholder="juan.perez">
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="password">Contraseña</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2">Entrar</button>
                </form>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
