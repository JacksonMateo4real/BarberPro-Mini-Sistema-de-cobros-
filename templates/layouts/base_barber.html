{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}<title>BarberPro</title>{% endblock %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="bp-topbar sticky-top">
        <div class="container-fluid px-4 py-2 d-flex align-items-center justify-content-between">
            <a href="{% url 'barber_dashboard' %}" class="bp-brand">BarberPro</a>
            <nav class="d-flex align-items-center">
                <a href="{% url 'barber_dashboard' %}" class="bp-topbar-link">Inicio</a>
                <a href="{% url 'barber_profile' %}" class="bp-topbar-link">Mi perfil</a>
                <a href="{% url 'logout' %}" class="bp-topbar-link bp-topbar-link--danger" onclick="return confirm('¿Seguro que deseas cerrar sesión?');">Cerrar sesión</a>
            </nav>
        </div>
    </header>

    <div class="container flex-grow-1 py-4">

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert"><small>{{ message }}</small></div>
            {% endfor %}
        {% endif %}

        {% block main %} {% endblock %}
        {% block aside %} {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
