{% extends 'layouts/base_owner.html' %}
{% load static %}

{% block title %}<title>Crear empleado | BarberPro</title>{% endblock %}

{% block main %}
<main class="bp-main p-4 p-md-5">
    <div class="mb-4">
        <h2 class="mb-1" style="font-size: 1.4rem;">Crear empleado</h2>
        <p class="text-muted mb-0" style="font-size: 0.88rem;">Da de alta a un nuevo miembro del equipo</p>
    </div>

    <div class="card p-4" style="max-width: 640px;">
        <form method="POST" action="{% url 'owner_create_employee' %}">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" placeholder="juan.perez" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" name="email" placeholder="juan@barberpro.com" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="first_name" placeholder="Juan" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" name="last_name" placeholder="Pérez" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" placeholder="Mínimo 8 caracteres" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Número de teléfono</label>
                    <input type="tel" name="phone_number" placeholder="809-000-0000" class="form-control" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Rol</label>
                <select name="role" class="form-select" required>
                    <option value="">Selecciona un rol</option>
                    <option value="owner">Propietario</option>
                    <option value="barber">Barbero</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success px-4 py-2">Crear empleado</button>
        </form>
    </div>
</main>
{% endblock %}
